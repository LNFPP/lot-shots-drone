name: Build Lot Shots Sorter (Mac)

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple Silicon + Intel)
        working-directory: mac
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> $GITHUB_ENV

      - name: Make the .app
        run: |
          APP="Lot Shots Sorter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN/LotShotsSorter" "$APP/Contents/MacOS/LotShotsSorter"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>LotShotsSorter</string>
            <key>CFBundleIdentifier</key><string>com.lotshots.sorter</string>
            <key>CFBundleName</key><string>Lot Shots Sorter</string>
            <key>CFBundleDisplayName</key><string>Lot Shots Sorter</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" LotShotsSorter-mac.zip

      # Always-current download:
      # https://github.com/<you>/<repo>/releases/download/mac-latest/LotShotsSorter-mac.zip
      - name: Publish to "mac-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest LotShotsSorter-mac.zip --title "Lot Shots Sorter for Mac (latest)" --notes "build=${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" --latest=false
