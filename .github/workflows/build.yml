name: Build Lot Shots APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk LotShots.apk

      # Always-current download link:
      # https://github.com/<you>/<repo>/releases/latest/download/LotShots.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LotShots.apk --title "Lot Shots (latest)" --notes "Built from ${GITHUB_SHA::7}" --latest
